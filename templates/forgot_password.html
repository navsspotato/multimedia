<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CVMC Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: rgba(67, 107, 147, 0.55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #fff;
            border-radius: 40px;
            padding: 56px 48px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #0f1f3d;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .contact-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 32px;
        }
        .contact-box p {
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
        }
        .contact-box p:last-child { margin-bottom: 0; }
        .contact-box strong { color: #0f1f3d; font-size: 14px; }
        .note {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .btn-back {
            display: block;
            width: 100%;
            padding: 14px;
            background: #e5e7eb;
            color: #1e293b;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-back:hover { background: #d1d5db; color: #0f1f3d; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Forgot your password?</h2>
        <p class="subtitle">Please contact your system administrator to reset your password.</p>

        <div class="contact-box">
            <p><strong>Administrator</strong></p>
            <p><i class="bi bi-person-circle"></i> Joyce Ann La Madrid</p> <!-- change to actual admin email/landline no. of it office -->
            <p><i class="bi bi-telephone"></i> 2009 </p>
            <p><i class="bi bi-geo-alt"></i> CVMC — Multimedia Unit</p>
        </div>

        <p class="note">
            Your admin will verify your identity and reset your password manually. Please reach out during office hours.
        </p>

        <a href="/login/" class="btn-back">Cancel</a>
    </div>
</body>
</html>

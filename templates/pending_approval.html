<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pending Approval</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f0f4fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .card { 
            background: #fff; 
            border-radius: 24px; 
            padding: 48px 40px; 
            max-width: 440px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.08); 
        }

        .icon-wrap { 
            width: 72px; 
            height: 72px; 
            background: #fef9c3; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 20px; 
        }

        .icon-wrap i { 
            font-size: 36px; 
            color: #ca8a04; 
        }

        h2 { 
            font-family: 'Syne', sans-serif; 
            font-size: 22px; 
            color: #0f1f3d; 
            margin-bottom: 10px; 
        }

        p { 
            font-size: 14px; 
            color: #64748b; 
            line-height: 1.7; 
            margin-bottom: 28px; 
        }

        a { 
            display: inline-block; 
            padding: 10px 28px; 
            background: #2563eb; 
            color: #fff; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 14px; 
            text-decoration: none; 
        }

        a:hover { 
            background: #1d4ed8; 
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <i class="bi bi-hourglass-split"></i>
        </div>
        <h2>Account Pending Approval</h2>
        <p>Your account has been created and is currently waiting for administrator approval. You'll be able to log in once your account is reviewed.</p>
        <a href="/login/">Back to Login</a>
    </div>
</body>
</html>
